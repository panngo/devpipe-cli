name: Simple Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Is this a prerelease?'
        required: false
        default: 'false'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Build all binaries
        run: |
          mkdir -p dist
          
          # Build Linux binaries
          GOOS=linux GOARCH=amd64 go build -o dist/devpipe-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -o dist/devpipe-linux-arm64 main.go
          
          # Build macOS binaries
          GOOS=darwin GOARCH=amd64 go build -o dist/devpipe-darwin-amd64 main.go
          GOOS=darwin GOARCH=arm64 go build -o dist/devpipe-darwin-arm64 main.go
          
          # Build Windows binaries
          GOOS=windows GOARCH=amd64 go build -o dist/devpipe-windows-amd64.exe main.go
          GOOS=windows GOARCH=arm64 go build -o dist/devpipe-windows-arm64.exe main.go
          
          # Make binaries executable
          chmod +x dist/devpipe-linux-amd64
          chmod +x dist/devpipe-linux-arm64
          chmod +x dist/devpipe-darwin-amd64
          chmod +x dist/devpipe-darwin-arm64
          
          # List built binaries
          echo "Built binaries:"
          ls -la dist/

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/devpipe-linux-amd64
            dist/devpipe-linux-arm64
            dist/devpipe-darwin-amd64
            dist/devpipe-darwin-arm64
            dist/devpipe-windows-amd64.exe
            dist/devpipe-windows-arm64.exe
          tag_name: ${{ github.event.inputs.version }}
          name: DevPipe ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: |
            ## DevPipe CLI Release ${{ github.event.inputs.version }}
            
            ### Supported Platforms
            - Linux (amd64, arm64)
            - macOS (amd64, arm64)
            - Windows (amd64, arm64)
            
            ### Quick Installation
            ```bash
            curl -fsSL https://raw.githubusercontent.com/panngo/devpipe-cli/main/install.sh | bash
            ```
            
            ### Platform-Specific Installation
            
            **Linux/macOS:**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/panngo/devpipe-cli/main/install-unix.sh | bash
            ```
            
            **Windows (PowerShell):**
            ```powershell
            powershell -ExecutionPolicy Bypass -Command "& { iwr https://raw.githubusercontent.com/panngo/devpipe-cli/main/install.ps1 -UseBasicParsing | iex }"
            ```
            
            ### Manual Download
            Download the appropriate binary for your platform and make it executable:
            ```bash
            chmod +x devpipe
            sudo mv devpipe /usr/local/bin/
            ```
            
            ### What's New
            - Enhanced installation scripts with platform detection
            - Support for all major platforms (Linux, macOS, Windows)
            - Automatic binary downloads from GitHub Releases
            - Improved error handling and user feedback
            
            ### Documentation
            - [Installation Guide](https://github.com/panngo/devpipe-cli/blob/main/INSTALLATION.md)
            - [README](https://github.com/panngo/devpipe-cli/blob/main/README.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 